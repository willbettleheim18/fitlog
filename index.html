<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3BFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Fitlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --ink:#141B2D; --muted:#5E6780; --line:#D9DEEA;
  --accent:#1F3BFF; --accent-ink:#FFFFFF; --sun:#E08A00; --good:#0E8F5B; --bad:#C23B3B; --track:#DDE2F0;
  --display:'Familjen Grotesk','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --surface:#171D31; --ink:#EEF1FA; --muted:#98A2C0; --line:#2A3250;
    --accent:#6F85FF; --accent-ink:#0B1030; --sun:#F2A93B; --good:#3DD598; --bad:#FF7A7A; --track:#262E4B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#171D31; --ink:#EEF1FA; --muted:#98A2C0; --line:#2A3250;
  --accent:#6F85FF; --accent-ink:#0B1030; --sun:#F2A93B; --good:#3DD598; --bad:#FF7A7A; --track:#262E4B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700;line-height:1.1}
h2{font-size:19px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.top .date{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{margin-bottom:12px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.banner b{font-family:var(--display);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.stop{background:var(--bad);color:#fff}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.banner .btn{background:var(--bg);color:var(--ink)}
.btn.block{width:100%}
/* jog hero */
.hero{text-align:center;padding:22px 18px 20px}
.ring{position:relative;width:236px;height:236px;margin:2px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--track);stroke-width:14}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time{font-family:var(--display);font-weight:700;font-size:54px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ring .lbl{color:var(--muted);font-size:14px;margin-top:6px}
.hero .sub{margin-bottom:16px}
.running .ring .fg{stroke:var(--good)}
details.manual{margin-top:14px;text-align:left}
details.manual summary{cursor:pointer;color:var(--muted);font-size:14px;text-align:center;list-style:none;padding:6px}
.row{display:flex;gap:10px;align-items:center}
input[type=number],input[type=time],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px;width:100%}
textarea{padding:10px 12px;min-height:90px;font-size:13px}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.log{list-style:none;margin:14px 0 0;padding:0}
.log li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .what{font-weight:600}
.log .meta{color:var(--muted);font-size:14px}
.x{width:40px;height:40px;border-radius:10px;color:var(--muted);font-size:20px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
/* weight */
.wt{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 14px}
.wt input{width:150px;text-align:center;font-family:var(--display);font-weight:700;font-size:38px;min-height:68px;letter-spacing:-.02em}
.step{width:56px;height:56px;border-radius:16px;border:1.5px solid var(--line);font-size:26px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:12px}
.stat .n{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.stat .t{color:var(--muted);font-size:13px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{display:flex;width:100%;max-width:520px;gap:6px}
nav button{flex:1;min-height:54px;border-radius:14px;font-weight:600;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9}
.week{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
var KEY='fitlog.v1';
var ACT_TYPES=['Walk','Cycle','Gym','Swim','Yoga','Sports','Other'];
function def(){return {goalMin:30,reminder:'06:30',jogs:[],acts:[],weights:[],timerStart:null};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);return Object.assign(def(),o);}}catch(e){}return def();}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var tab='today', selType='Walk', draftW=null, tickId=null;

function dkey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fromKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function pad(n){return String(n).padStart(2,'0');}
function fmtClock(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):pad(m)+':'+pad(s);}
function mins(sec){return Math.round(sec/60);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jogSecOn(k){return S.jogs.filter(function(j){return j.date===k;}).reduce(function(a,j){return a+j.sec;},0);}
function actMinOn(k){return S.acts.filter(function(a){return a.date===k;}).reduce(function(x,a){return x+a.min;},0);}
function weightOn(k){var w=S.weights.filter(function(w){return w.date===k;})[0];return w?w.kg:null;}
function sortedW(){return S.weights.slice().sort(function(a,b){return a.date<b.date?-1:1;});}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.id);toast.id=setTimeout(function(){t.hidden=true;},2000);}
function elapsed(){return S.timerStart?(Date.now()-S.timerStart)/1000:0;}

/* ---------- views ---------- */
function viewToday(){
  var today=dkey(), jogSec=jogSecOn(today), goalSec=S.goalMin*60;
  var run=!!S.timerStart, shown=run?elapsed():jogSec;
  var C=2*Math.PI*104, pct=Math.min(1,(jogSec+(run?elapsed():0))/goalSec);
  var d=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  var banner=weightOn(today)===null?'<div class="banner"><div><b>Weigh-in due</b><div class="small" style="opacity:.75">Not logged today</div></div><button class="btn small" data-go="weight">Log weight</button></div>':'';
  var items=[];
  S.jogs.filter(function(j){return j.date===today;}).forEach(function(j){items.push({id:j.id,kind:'jog',title:'Jog',meta:fmtClock(j.sec),t:j.id});});
  S.acts.filter(function(a){return a.date===today;}).forEach(function(a){items.push({id:a.id,kind:'act',title:a.type,meta:a.min+' min'+(a.note?' · '+esc(a.note):''),t:a.id});});
  items.sort(function(a,b){return b.t-a.t;});
  var list=items.length?'<ul class="log">'+items.map(function(i){return '<li><div><div class="what">'+i.title+'</div><div class="meta">'+i.meta+'</div></div><button class="x" data-del="'+i.kind+':'+i.id+'" aria-label="Delete '+i.title+'">×</button></li>';}).join('')+'</ul>':'<p class="empty">Nothing logged yet today.</p>';
  return '<div class="top"><div><h1>Today</h1><div class="date">'+d+'</div></div></div>'+banner+
  '<section class="card hero '+(run?'running':'')+'"><div class="ring"><svg viewBox="0 0 236 236" aria-hidden="true"><circle class="bgc" cx="118" cy="118" r="104"/><circle class="fg" id="fg" cx="118" cy="118" r="104" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/></svg><div class="mid"><div class="time" id="clock">'+fmtClock(shown)+'</div><div class="lbl" id="clbl">'+(run?'Jogging now':'Jogged today')+'</div></div></div>'+
  '<p class="sub muted" id="goal">'+mins(jogSec)+' of '+S.goalMin+' min goal</p>'+
  '<button class="btn block '+(run?'stop':'')+'" id="jogBtn">'+(run?'Stop and save jog':'Start jog')+'</button>'+
  '<details class="manual"><summary>Add jog time manually</summary><div class="row" style="margin-top:8px"><input type="number" id="manJog" inputmode="numeric" min="1" max="600" placeholder="Minutes"><button class="btn ghost" id="manJogBtn">Add</button></div></details></section>'+
  '<section class="card"><h2>Other activity</h2><div class="chips" role="group" aria-label="Activity type">'+ACT_TYPES.map(function(t){return '<button class="chip" data-type="'+t+'" aria-pressed="'+(t===selType)+'">'+t+'</button>';}).join('')+'</div>'+
  '<div class="row"><input type="number" id="actMin" inputmode="numeric" min="1" max="600" placeholder="Minutes" aria-label="Minutes"><input type="text" id="actNote" placeholder="Note (optional)" aria-label="Note" style="font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px;width:100%"></div>'+
  '<button class="btn block" id="actBtn" style="margin-top:10px">Add activity</button></section>'+
  '<section class="card"><h2>Logged today</h2>'+list+'</section>';
}

function weightChart(){
  var w=sortedW().slice(-30);
  if(w.length<2)return '<p class="empty">Log at least two weigh-ins to see your trend.</p>';
  var W=340,H=170,pl=34,pr=12,pt=12,pb=24;
  var t0=fromKey(w[0].date).getTime(), t1=fromKey(w[w.length-1].date).getTime(); if(t1===t0)t1=t0+1;
  var vals=w.map(function(x){return x.kg;}), lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(hi-lo<1){var m=(hi+lo)/2;lo=m-.5;hi=m+.5;} else {lo-=.3;hi+=.3;}
  function X(d){return pl+(fromKey(d).getTime()-t0)/(t1-t0)*(W-pl-pr);}
  function Y(v){return pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);}
  var pts=w.map(function(x){return X(x.date).toFixed(1)+','+Y(x.kg).toFixed(1);});
  var dots=w.map(function(x){return '<circle cx="'+X(x.date).toFixed(1)+'" cy="'+Y(x.kg).toFixed(1)+'" r="3.5" style="fill:var(--sun)"/>';}).join('');
  var grid=[lo,(lo+hi)/2,hi].map(function(v){return '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v.toFixed(1)+'</text>';}).join('');
  var dl=function(d){return fromKey(d).toLocaleDateString(undefined,{day:'numeric',month:'short'});};
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight trend">'+grid+'<polyline points="'+pts.join(' ')+'" fill="none" style="stroke:var(--sun)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'<text x="'+pl+'" y="'+(H-6)+'">'+dl(w[0].date)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+dl(w[w.length-1].date)+'</text></svg>';
}

function viewWeight(){
  var today=dkey(), all=sortedW(), last=all.length?all[all.length-1].kg:null;
  if(draftW===null){var tw=weightOn(today);draftW=tw!==null?tw:(last!==null?last:70);}
  var first=all.length?all[0].kg:null;
  var diff=(first!==null&&last!==null)?(last-first):null;
  var recent=all.filter(function(x){return (fromKey(today)-fromKey(x.date))/864e5<7;});
  var avg=recent.length?recent.reduce(function(a,x){return a+x.kg;},0)/recent.length:null;
  var hist=all.slice().reverse().slice(0,30).map(function(x){var dt=fromKey(x.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});return '<li><div><div class="what">'+x.kg.toFixed(1)+' kg</div><div class="meta">'+dt+'</div></div><button class="x" data-del="w:'+x.date+'" aria-label="Delete weigh-in">×</button></li>';}).join('');
  return '<div class="top"><div><h1>Weigh-in</h1><div class="date">'+(weightOn(today)!==null?'Logged today: '+weightOn(today).toFixed(1)+' kg':'Not logged today')+'</div></div></div>'+
  '<section class="card"><div class="wt"><button class="step" data-step="-0.1" aria-label="Decrease 0.1 kg">−</button><input type="number" id="wIn" inputmode="decimal" step="0.1" min="20" max="400" value="'+draftW.toFixed(1)+'" aria-label="Weight in kilograms"><button class="step" data-step="0.1" aria-label="Increase 0.1 kg">+</button></div><p class="muted small" style="text-align:center;margin-bottom:12px">kilograms</p><button class="btn block" id="wSave">'+(weightOn(today)!==null?'Update today\'s weigh-in':'Save weigh-in')+'</button></section>'+
  '<section class="card"><h2>Summary</h2><div class="stats"><div class="stat"><div class="n">'+(last!==null?last.toFixed(1):'–')+'</div><div class="t">Latest kg</div></div><div class="stat"><div class="n">'+(diff!==null?(diff>0?'+':'')+diff.toFixed(1):'–')+'</div><div class="t">Since first</div></div><div class="stat"><div class="n">'+(avg!==null?avg.toFixed(1):'–')+'</div><div class="t">7-day avg</div></div></div></section>'+
  '<section class="card"><h2>Trend</h2>'+weightChart()+'</section>'+
  '<section class="card"><h2>History</h2>'+(hist?'<ul class="log">'+hist+'</ul>':'<p class="empty">No weigh-ins yet.</p>')+'</section>';
}

function streak(){
  var n=0, d=new Date(), g=S.goalMin*60;
  if(jogSecOn(dkey(d))<g)d.setDate(d.getDate()-1);
  while(jogSecOn(dkey(d))>=g){n++;d.setDate(d.getDate()-1);}
  return n;
}

function viewProgress(){
  var days=[],i;
  for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dkey(d);days.push({k:k,label:d.toLocaleDateString(undefined,{weekday:'narrow'}),jog:mins(jogSecOn(k)),act:actMinOn(k),w:weightOn(k)!==null});}
  var mx=Math.max(S.goalMin,Math.max.apply(null,days.map(function(x){return x.jog;})))*1.15;
  var W=340,H=170,pl=8,pb=22,pt=16,bw=28,gap=(W-pl*2-bw*7)/6;
  var bars=days.map(function(x,idx){var h=x.jog/mx*(H-pt-pb),xx=pl+idx*(bw+gap);return '<rect x="'+xx.toFixed(1)+'" y="'+(H-pb-h).toFixed(1)+'" width="'+bw+'" height="'+Math.max(h,x.jog?2:0).toFixed(1)+'" rx="6" style="fill:'+(x.jog>=S.goalMin?'var(--good)':'var(--accent)')+'"/><text x="'+(xx+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+x.label+'</text>'+(x.jog?'<text x="'+(xx+bw/2).toFixed(1)+'" y="'+(H-pb-h-4).toFixed(1)+'" text-anchor="middle">'+x.jog+'</text>':'');}).join('');
  var gy=H-pb-S.goalMin/mx*(H-pt-pb);
  var goalLine='<line x1="0" x2="'+W+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke-dasharray="4 4" style="stroke:var(--muted)" stroke-width="1"/>';
  var wkJog=days.reduce(function(a,x){return a+x.jog;},0), wkAct=days.reduce(function(a,x){return a+x.act;},0), wkW=days.filter(function(x){return x.w;}).length;
  var hit=days.filter(function(x){return x.jog>=S.goalMin;}).length;
  return '<div class="top"><div><h1>Progress</h1><div class="date">Last 7 days</div></div></div>'+
  '<section class="card"><h2>Jogging minutes</h2><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Jogging minutes per day">'+goalLine+bars+'</svg><p class="muted small" style="margin-top:6px">Dashed line is your '+S.goalMin+' min goal. Green bars hit it.</p>'+
  '<div class="week"><div class="stat"><div class="n">'+streak()+'</div><div class="t">Day streak</div></div><div class="stat"><div class="n">'+hit+'/7</div><div class="t">Goal days</div></div><div class="stat"><div class="n">'+wkJog+'</div><div class="t">Jog min</div></div><div class="stat"><div class="n">'+wkAct+'</div><div class="t">Other activity min</div></div><div class="stat"><div class="n">'+wkW+'/7</div><div class="t">Weigh-ins</div></div></div></section>'+
  '<section class="card"><h2>Settings</h2><label class="f" for="goalIn">Daily jogging goal (minutes)</label><input type="number" id="goalIn" inputmode="numeric" min="5" max="300" value="'+S.goalMin+'"><label class="f" for="remIn" style="margin-top:12px">Weigh-in reminder time</label><input type="time" id="remIn" value="'+S.reminder+'"><button class="btn block" id="setSave" style="margin-top:12px">Save settings</button><p class="muted small" style="margin-top:10px">A web page can\'t ring a closed app. The daily reminder lives in your phone\'s Clock app as an alarm.</p></section>'+
  '<section class="card"><h2>Backup</h2><p class="muted small" style="margin-bottom:10px">Your data stays in this browser. Copy a backup before clearing Chrome data.</p><div class="row"><button class="btn ghost small" id="bkCopy">Copy backup</button><button class="btn ghost small" id="bkLoad">Restore</button></div><textarea id="bkText" placeholder="Paste a backup here, then tap Restore" style="margin-top:10px" aria-label="Backup text"></textarea></section>';
}

var ICONS={today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',weight:'<svg viewBox="0 0 24 24"><path d="M5 20h14l-2-12H7z"/><path d="M9.5 8a2.5 2.5 0 0 1 5 0"/></svg>',progress:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'};
var NAMES={today:'Today',weight:'Weight',progress:'Progress'};

function render(){
  var app=document.getElementById('app');
  app.innerHTML=tab==='today'?viewToday():tab==='weight'?viewWeight():viewProgress();
  document.getElementById('nav').innerHTML=['today','weight','progress'].map(function(t){return '<button data-tab="'+t+'" '+(t===tab?'aria-current="page"':'')+'>'+ICONS[t]+NAMES[t]+'</button>';}).join('');
  window.scrollTo(0,0);
}

function tick(){
  var c=document.getElementById('clock');
  if(!c||!S.timerStart)return;
  var e=elapsed(), C=2*Math.PI*104, js=jogSecOn(dkey());
  c.textContent=fmtClock(e);
  var fg=document.getElementById('fg');
  if(fg)fg.setAttribute('stroke-dashoffset',C*(1-Math.min(1,(js+e)/(S.goalMin*60))));
}
function startTick(){stopTick();tickId=setInterval(tick,1000);}
function stopTick(){if(tickId){clearInterval(tickId);tickId=null;}}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('button');if(!el)return;
  if(el.dataset.tab){tab=el.dataset.tab;render();return;}
  if(el.dataset.go){tab=el.dataset.go;render();return;}
  if(el.dataset.type){selType=el.dataset.type;document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c.dataset.type===selType);});return;}
  if(el.dataset.step){var inp=document.getElementById('wIn');var v=parseFloat(inp.value);if(isNaN(v))v=draftW;v=Math.round((v+parseFloat(el.dataset.step))*10)/10;draftW=v;inp.value=v.toFixed(1);return;}
  if(el.dataset.del){var p=el.dataset.del.split(':'),k=p[0],id=p.slice(1).join(':');
    if(k==='jog')S.jogs=S.jogs.filter(function(j){return String(j.id)!==id;});
    else if(k==='act')S.acts=S.acts.filter(function(a){return String(a.id)!==id;});
    else if(k==='w'){S.weights=S.weights.filter(function(w){return w.date!==id;});draftW=null;}
    save();render();return;}
  switch(el.id){
    case 'jogBtn':
      if(S.timerStart){var sec=Math.round(elapsed());S.timerStart=null;stopTick();
        if(sec>=10){S.jogs.push({id:Date.now(),date:dkey(),sec:sec});toast('Saved '+fmtClock(sec)+' jog');}
        else toast('Under 10 seconds, not saved');
      } else {S.timerStart=Date.now();startTick();}
      save();render();break;
    case 'manJogBtn':
      var m=parseInt(document.getElementById('manJog').value,10);
      if(!m||m<1){toast('Enter minutes first');break;}
      S.jogs.push({id:Date.now(),date:dkey(),sec:m*60});save();toast('Added '+m+' min jog');render();break;
    case 'actBtn':
      var am=parseInt(document.getElementById('actMin').value,10),note=document.getElementById('actNote').value.trim();
      if(!am||am<1){toast('Enter minutes first');break;}
      S.acts.push({id:Date.now(),date:dkey(),type:selType,min:am,note:note});save();toast(selType+' added');render();break;
    case 'wSave':
      var wv=parseFloat(document.getElementById('wIn').value);
      if(isNaN(wv)||wv<20||wv>400){toast('Enter a valid weight');break;}
      wv=Math.round(wv*10)/10;var t=dkey();
      S.weights=S.weights.filter(function(w){return w.date!==t;});S.weights.push({date:t,kg:wv});draftW=wv;save();toast('Weigh-in saved');render();break;
    case 'setSave':
      var g=parseInt(document.getElementById('goalIn').value,10),r=document.getElementById('remIn').value;
      if(g>=5&&g<=300)S.goalMin=g;if(r)S.reminder=r;save();toast('Settings saved');render();break;
    case 'bkCopy':
      var txt=JSON.stringify(S);
      try{navigator.clipboard.writeText(txt).then(function(){toast('Backup copied');},function(){fallbackCopy(txt);});}catch(e){fallbackCopy(txt);}
      break;
    case 'bkLoad':
      try{var o=JSON.parse(document.getElementById('bkText').value);if(!o||!Array.isArray(o.weights))throw 0;S=Object.assign(def(),o);S.timerStart=null;save();toast('Backup restored');render();}catch(e){toast('That backup isn\'t valid');}
      break;
  }
});
function fallbackCopy(txt){var ta=document.getElementById('bkText');if(ta){ta.value=txt;ta.select();toast('Backup shown below. Copy it');}}
document.addEventListener('input',function(ev){if(ev.target.id==='wIn'){var v=parseFloat(ev.target.value);if(!isNaN(v))draftW=v;}});

render();
if(S.timerStart)startTick();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&tab==='today')render();});
})();
</script>
</body>
</html>
